<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">TechNova</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Contact Content -->
    <main>
        <section class="content">

            <h1>Contact Us</h1>

            <div class="contact-container">

                <div class="contact-info">
                    <h2>Get in Touch</h2>

                    <p><strong>Email:</strong> info@technova.com</p>
                    <p><strong>Phone:</strong> +91 98765 43210</p>
                    <p><strong>Address:</strong> Kerala, India</p>
                </div>

                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="Enter your name">

                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Enter your email">

                    <label for="message">Message:</label>
                    <textarea id="message" rows="5"
                        placeholder="Enter your message"></textarea>

                    <button type="submit">Send Message</button>
                </form>

            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 TechNova. All Rights Reserved.</p>
        <p>Email: info@technova.com | Phone: +91 98765 43210</p>
    </footer>

</body>
</html>
